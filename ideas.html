<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>רעיונות לשם</title>
<style>
:root{--bg:#f6f5f2;--card:#ffffff;--ink:#1d1f22;--mute:#6a6f76;--line:#d9d6cf;--acc:#1d4ed8}
@media (prefers-color-scheme: dark){:root{--bg:#16171a;--card:#1f2125;--ink:#ecebe8;--mute:#9aa0a8;--line:#33363c;--acc:#7aa2ff}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.6 system-ui,-apple-system,"Segoe UI",Arial,sans-serif}
main{max-width:560px;margin:0 auto;padding:24px 16px 48px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px}
h1{font-size:22px;margin:0 0 10px}
p{margin:0 0 12px}
.mute{color:var(--mute);font-size:15px}
label{display:block;font-weight:600;margin:14px 0 6px}
input,textarea{width:100%;font:inherit;padding:11px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
textarea{min-height:70px;resize:vertical}
button{font:inherit;font-weight:600;width:100%;padding:14px;border:0;border-radius:10px;background:var(--acc);color:#fff;cursor:pointer;margin-top:16px}
button:disabled{opacity:.5;cursor:default}
.ok{font-size:20px;font-weight:600}
.err{color:#b42318;margin-top:10px}
</style>
</head>
<body>
<main><div class="card" id="view">
  <h1>רעיונות לשם החדש</h1>
  <p>אנחנו בוחרים שם חדש לסוכנות. לפני שאנחנו בודקים את השמות מול אנשים, נשמח לרעיונות שלך.</p>
  <p class="mute">אפשר לכתוב עד 5 שמות. שורה אחת על כל שם: למה הוא טוב. לא חובה.</p>
  <div id="rows"></div>
  <button id="send" disabled>שליחה</button>
  <div class="err" id="err" hidden></div>
</div></main>
<script>
(function(){
'use strict';
var URL_='https://flrnzzjqmovufyqelbxj.supabase.co/rest/v1/naming_survey_ideas';
var KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZscm56empxbW92dWZ5cWVsYnhqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzEzMDg1ODcsImV4cCI6MjA4Njg4NDU4N30.rffIx1E61wduuC4arYpn4mdS_GwXnb0eX3YrsSmSI0g';
var src=(new URLSearchParams(location.search).get('src')||'').toLowerCase().replace(/[^a-z0-9_]/g,'').slice(0,30)||null;
var rows=document.getElementById('rows'), btn=document.getElementById('send'), err=document.getElementById('err');
for(var i=1;i<=5;i++){
  rows.insertAdjacentHTML('beforeend','<label for="n'+i+'">שם '+i+'</label><input id="n'+i+'" maxlength="60" autocomplete="off"><textarea id="w'+i+'" maxlength="300" placeholder="למה הוא טוב (לא חובה)"></textarea>');
}
function names(){ var out=[]; for(var i=1;i<=5;i++){ var n=document.getElementById('n'+i).value.trim(); if(n) out.push({name:n, why:document.getElementById('w'+i).value.trim()||null}); } return out; }
rows.addEventListener('input',function(){ btn.disabled = names().length===0; });
btn.onclick=function(){
  var list=names(); if(!list.length) return; btn.disabled=true; err.hidden=true;
  var body=list.map(function(x){ return {src:src, idea:x.name, why:x.why}; });
  fetch(URL_,{method:'POST',headers:{'Content-Type':'application/json','Prefer':'return=minimal',apikey:KEY,Authorization:'Bearer '+KEY},body:JSON.stringify(body)})
   .then(function(r){ if(!r.ok) throw new Error(r.status);
     document.getElementById('view').innerHTML='<p class="ok">תודה! קיבלנו.</p><p>אפשר לסגור את הדף.</p>'; })
   .catch(function(){ err.textContent='משהו לא נשלח. אפשר לנסות שוב בעוד רגע.'; err.hidden=false; btn.disabled=false; });
};
})();
</script>
</body>
</html>
